name = "ws-depicejas-bot"
main = "src/app.ts"
compatibility_date = "2024-09-23"

[assets]
directory = "web"
binding = "ASSETS"
# /admin/* tiene archivos estáticos reales (web/admin/*), pero deben pasar
# primero por src/app.ts para la autenticación básica — sin esto, Cloudflare
# serviría esos archivos directo sin pedir usuario/contraseña. La versión de
# wrangler instalada solo soporta la forma booleana (todo pasa por el
# Worker primero); src/app.ts tiene un catch-all al final que reenvía todo
# lo que no es una ruta de la API hacia los assets estáticos.
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "depicejas-db"
database_id = "a6c52634-dc32-4b2c-8e9f-8139371e5eaf"
